version: "3.9"

services:
  cctv:
    build: .
    container_name: cctv-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
    env_file:
      - ./server/.env
    volumes:
      # MediaMTX config live-edit ke liye
      - ./server/mediamtx:/app/server/mediamtx:ro
      # Models (bade hote hain)
      - ./server/detector-ai/models:/app/server/detector-ai/models:ro
      # Snapshots (host pe save ho)
      - ./server/snapshots:/app/server/snapshots